name: fuzz-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # No iteration count: the campaign binary defaults to the budget
      # `spec/v1/constants.toml` declares, and the crate is held to that
      # declaration by test. Naming the number here made it a second copy that
      # nothing compared — a raised budget would have left this job running the
      # old one and reporting success.
      - run: cargo run --release --locked -p kf-fuzz --bin kf-fuzz-campaign

  # The published rate-distortion numbers, re-derived in full. The gate that
  # runs on every change re-encodes the ends of each quality ladder because a
  # slow gate gets skipped; this one has the time to check all sixty points, so
  # nothing in the receipt goes unrechecked for longer than a day.
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: ./scripts/fetch-corpus.sh
      - run: cargo run --release --locked -p kf-tools --example rd_verify -- --receipts bench/results/rd-campaign.json
