name: fuzz-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
      - run: cargo run --release --locked -p kf-fuzz --bin kf-fuzz-campaign -- --iterations 20000000

  # The published rate-distortion numbers, re-derived in full. The gate that
  # runs on every change re-encodes the ends of each quality ladder because a
  # slow gate gets skipped; this one has the time to check all sixty points, so
  # nothing in the receipt goes unrechecked for longer than a day.
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
      - run: ./scripts/fetch-corpus.sh
      - run: cargo run --release --locked -p kf-tools --example rd_verify -- --receipts bench/results/rd-campaign.json
