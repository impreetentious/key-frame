name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # `preflight.sh` is the whole gate list, and one of those gates builds the
  # projection room and drives it in a real browser. This job used to set up
  # Rust and nothing else, so the run reached step twenty-eight and asked for a
  # Chromium that had never been installed — while the `site` workflow, which
  # runs the same gate directly, declared exactly these steps. Two workflows
  # disagreeing about what one script needs is the kind of thing that stays
  # true until someone runs it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - run: npm --prefix inspector ci
      - run: npx --prefix inspector playwright install --with-deps chromium
      - run: ./scripts/preflight.sh

  bitexact-native:
    name: bitexact-native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
      - run: ./scripts/ci/conformance-gate.sh
