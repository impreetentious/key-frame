name: Feature request
description: Propose a scoped improvement to the codec, the tools, or the projection room.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and teaching value
      description: What coding decision, failure mode, or reader need does this address?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: Mention bit-exactness, bitstream and version impact, both decoders, conformance vectors, tests, and any needed ADR.
    validations:
      required: true
