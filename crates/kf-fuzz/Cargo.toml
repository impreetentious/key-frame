[package]
name = "kf-fuzz"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kf-fuzz-campaign"
path = "src/bin/kf-fuzz-campaign.rs"

[dependencies]
kf-core = { path = "../kf-core" }
kf-dec = { path = "../kf-dec" }
kf-frame = { path = "../kf-frame" }
kf-ref = { path = "../kf-ref" }

# Only the campaign budget is read from here, and only in a test. The frozen
# constants declare the nightly iteration count and the generated documentation
# publishes it, so the number this crate compiles in has to be checked against
# the one the specification promises.
[dev-dependencies]
kf-spec = { path = "../kf-spec" }

[lints]
workspace = true
