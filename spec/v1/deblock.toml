[activity]
# A candidate strength from the decision table is skipped when any test fails.
skip_if_abs_p0_q0_ge_alpha = true
skip_if_abs_p1_p0_ge_beta = true
skip_if_abs_q1_q0_ge_beta = true

[weak]
delta = "clip(((q0-p0)*4 + (p1-q1) + 4) >> 3, -tc, tc)"
p0_out = "clip8(p0 + delta)"
q0_out = "clip8(q0 - delta)"

[strong]
p0_out = "(p2 + 2*p1 + 2*p0 + 2*q0 + q1 + 4) >> 3"
p1_out = "(p2 + p1 + p0 + q0 + 2) >> 2"
p2_out = "(2*p3 + 3*p2 + p1 + p0 + q0 + 4) >> 3"
q0_out = "(p1 + 2*p0 + 2*q0 + 2*q1 + q2 + 4) >> 3"
q1_out = "(p0 + q0 + q1 + q2 + 2) >> 2"
q2_out = "(p0 + q0 + q1 + 3*q2 + 2*q3 + 4) >> 3"
clip8_outputs = true

