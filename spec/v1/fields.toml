endianness = "little"

[sequence]
magic_ascii = "KFV1"
size_bytes = 24
crc_offset = 20
crc_start = 0
crc_length = 20
fields = [
  "magic:u32@0",
  "version:u16@4",
  "width:u16@6",
  "height:u16@8",
  "chroma:u8@10",
  "depth:u8@11",
  "fps_num:u16@12",
  "fps_den:u16@14",
  "kf_interval:u16@16",
  "golden_interval:u8@18",
  "flags:u8@19",
  "header_crc32c:u32@20",
]
required_nonzero = ["width", "height", "fps_num", "fps_den", "kf_interval", "golden_interval"]
reserved_zero = ["flags"]

[packet]
sync_ascii = "KFP1"
fixed_size_bytes = 24
header_crc_offset = 16
payload_crc_offset = 20
header_crc_start = 4
header_crc_length = 12
fields = [
  "sync:u32@0",
  "payload_len:u32@4",
  "frame_index:u32@8",
  "flags:u8@12",
  "frame_qp:u8@13",
  "reserved:u16@14",
  "header_crc32c:u32@16",
  "payload_crc32c:u32@20",
  "payload:bytes@24",
]

[packet.flags]
key = 0
golden_refresh = 1
show = 2
reserved_mask = 248
required_mask = 4
key_requires_mask = 2
