[workspace]
resolver = "3"
members = [
    "crates/kf-bitstream",
    "crates/kf-core",
    "crates/kf-dec",
    "crates/kf-enc",
    "crates/kf-frame",
    "crates/kf-fuzz",
    "crates/kf-predict",
    "crates/kf-probe",
    "crates/kf-range",
    "crates/kf-ref",
    "crates/kf-spec",
    "crates/kf-tools",
    "crates/kf-transform",
    "crates/kf-wasm",
]

[workspace.package]
version = "0.13.21"
authors = ["Sidakpreet Singh"]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Codec crates inherit this table. `disallowed_types` is what makes
# `clippy.toml`'s ban on floats, unordered maps, and ambient clocks real, so it
# is denied rather than merely warned: an `f64` on a path that reaches a
# decoded pixel is a bit-exactness bug, not a style opinion.
#
# `kf-tools` legitimately computes quality metrics in floating point and reads
# the filesystem, so it declares its own lint table and allows
# `disallowed_types` explicitly. It is the only crate that does. The WebAssembly
# surface declares its own table for a different reason — a module cannot export
# a function without `unsafe` — and keeps `disallowed_types` denied, because a
# boundary to JavaScript is still a path a decoded pixel travels.
#
# `priority = -1` on the group is load-bearing: without it Cargo can pass the
# group flag after the specific one and silently re-enable what a crate meant
# to allow.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"

# Release builds check integer arithmetic.
#
# The campaigns, the natural-corpus bit-exactness proof, the rate measurements,
# and the rate-distortion receipts all run `--release`, and they are the only
# places this repository pushes novel data through the codec at volume: the
# nightly job alone drives twenty million mutated streams through both decoders.
# With Cargo's default those are precisely the runs where an overflow wraps
# silently instead of stopping, so the largest verification budget in the
# project was the one blind to the failure it exists to find.
#
# An overflow anywhere in the signal path is a bit-exactness bug, not a
# performance trade, and this is not a performance project. `kf-fuzz` proves
# the setting is in effect rather than trusting this line.
[profile.release]
overflow-checks = true
