[workspace]
resolver = "3"
members = [
    "crates/kf-bitstream",
    "crates/kf-core",
    "crates/kf-dec",
    "crates/kf-enc",
    "crates/kf-frame",
    "crates/kf-fuzz",
    "crates/kf-predict",
    "crates/kf-probe",
    "crates/kf-range",
    "crates/kf-ref",
    "crates/kf-spec",
    "crates/kf-tools",
    "crates/kf-transform",
    "crates/kf-wasm",
]

[workspace.package]
version = "0.13.2"
authors = ["Sidakpreet Singh"]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Codec crates inherit this table. `disallowed_types` is what makes
# `clippy.toml`'s ban on floats, unordered maps, and ambient clocks real, so it
# is denied rather than merely warned: an `f64` on a path that reaches a
# decoded pixel is a bit-exactness bug, not a style opinion.
#
# The tools and the WASM surface legitimately compute quality metrics in
# floating point and read clocks for reporting. They declare their own lint
# table and allow `disallowed_types` explicitly, so the codec perimeter stays
# narrow enough to mean something.
#
# `priority = -1` on the group is load-bearing: without it Cargo can pass the
# group flag after the specific one and silently re-enable what a crate meant
# to allow.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"
